<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" role="img" aria-label="Nile Bites">
  <defs>
    <linearGradient id="nbGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1DFA4"/>
      <stop offset="42%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6239"/>
    </linearGradient>
  </defs>

  <g transform="translate(210 40)">
    <!-- sun disk -->
    <circle cx="0" cy="-6" r="13" fill="none" stroke="url(#nbGold)" stroke-width="1.6"/>
    <circle cx="0" cy="-6" r="5.5" fill="url(#nbGold)"/>
    <!-- lotus: centre petal -->
    <path d="M0 34 C -8 20 -8 6 0 -2 C 8 6 8 20 0 34 Z" fill="none" stroke="url(#nbGold)" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- inner side petals -->
    <path d="M0 34 C -19 24 -25 10 -22 -1 C -12 3 -4 16 0 34 Z" fill="none" stroke="url(#nbGold)" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M0 34 C 19 24 25 10 22 -1 C 12 3 4 16 0 34 Z" fill="none" stroke="url(#nbGold)" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- outer side petals -->
    <path d="M0 34 C -30 30 -40 18 -41 6 C -27 8 -12 20 0 34 Z" fill="none" stroke="url(#nbGold)" stroke-width="1.3" stroke-linejoin="round" opacity=".85"/>
    <path d="M0 34 C 30 30 40 18 41 6 C 27 8 12 20 0 34 Z" fill="none" stroke="url(#nbGold)" stroke-width="1.3" stroke-linejoin="round" opacity=".85"/>
    <!-- water line -->
    <path d="M-56 38 H 56" stroke="url(#nbGold)" stroke-width="1" opacity=".55"/>
    <path d="M-34 43 H 34" stroke="url(#nbGold)" stroke-width="1" opacity=".3"/>
  </g>

  <text x="210" y="112" text-anchor="middle"
        font-family="'Cormorant Garamond','Trajan Pro',Georgia,serif"
        font-size="42" letter-spacing="9" fill="url(#nbGold)">NILE BITES</text>
  <text x="210" y="134" text-anchor="middle"
        font-family="'Jost','Helvetica Neue',Arial,sans-serif"
        font-size="9.5" letter-spacing="6.5" fill="#E7D5A5" opacity=".72">EGYPTIAN KITCHEN &amp; BAKERY</text>
</svg>
