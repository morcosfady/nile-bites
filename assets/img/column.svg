<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 520" aria-hidden="true">
  <defs>
    <linearGradient id="colGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8c6239"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="62%" stop-color="#f1dfa4"/>
      <stop offset="100%" stop-color="#8c6239"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#colGold)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">

    <!-- abacus block above the capital -->
    <path d="M28 8 H62 V22 H28 Z"/>

    <!-- papyrus-umbel capital: bell of splayed stems -->
    <path d="M45 22 V44"/>
    <path d="M45 96 C22 92 12 74 14 52 C22 60 30 74 33 96"/>
    <path d="M45 96 C68 92 78 74 76 52 C68 60 60 74 57 96"/>
    <path d="M45 96 C33 88 28 68 31 44 C39 54 45 74 45 96"/>
    <path d="M45 96 C57 88 62 68 59 44 C51 54 45 74 45 96"/>
    <path d="M20 60 C30 52 60 52 70 60" opacity=".7"/>

    <!-- binding rings below the capital -->
    <path d="M31 100 H59 M29 106 H61 M31 112 H59"/>

    <!-- shaft, fluted -->
    <path d="M33 116 V470 M45 116 V470 M57 116 V470"/>
    <path d="M30 116 V470 M60 116 V470" opacity=".55"/>

    <!-- cartouche band across the shaft -->
    <path d="M28 244 H62 M28 286 H62" opacity=".7"/>
    <g opacity=".8" stroke-width="1">
      <!-- ankh -->
      <ellipse cx="45" cy="256" rx="4" ry="4.6"/>
      <path d="M45 261 V272 M39 265 H51"/>
      <!-- water ripple -->
      <path d="M37 279 q2.7 -3.4 5.4 0 t5.4 0"/>
    </g>

    <!-- base -->
    <path d="M28 470 H62 M24 478 H66 V492 H24 Z"/>
  </g>
</svg>
