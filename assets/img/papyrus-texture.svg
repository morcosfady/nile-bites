<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" aria-hidden="true">
  <!-- Papyrus / sandstone grain. Fibre streaks over a fine turbulence so large
       flat areas read as carved stone rather than flat CSS colour. -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.5" numOctaves="3" seed="21" result="f"/>
      <feColorMatrix in="f" type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="400" height="400" filter="url(#grain)" opacity="0.5"/>
  <rect width="400" height="400" filter="url(#fibre)" opacity="0.35"/>
</svg>
